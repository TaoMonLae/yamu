server {
    listen 80;
    server_name yamumon.com www.yamumon.com;
    server_tokens off;
    client_max_body_size 21m;
    gzip on;
    gzip_vary on;
    gzip_comp_level 4;
    gzip_types text/css application/javascript image/svg+xml;

    # These files are versioned by Next.js, so nginx can serve them without
    # waking the application process for every script, stylesheet, and font.
    location ^~ /_next/static/ {
        alias /var/www/mon-name-converter/yamu/.next/standalone/.next/static/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
        add_header X-DNS-Prefetch-Control "off" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Pin the public origin before Next.js trusts the forwarded host.
        proxy_set_header Host $server_name;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
